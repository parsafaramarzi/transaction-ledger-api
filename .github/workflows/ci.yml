name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatting (ruff)
        run: ruff format --check .

      - name: Types (mypy --strict)
        run: mypy

      - name: Tests
        run: pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ledger:ci .
      - name: Smoke test
        run: |
          docker run -d --name ledger -p 8000:8000 ledger:ci
          for i in $(seq 1 20); do
            curl -sf localhost:8000/docs > /dev/null && break
            sleep 1
          done
          curl -sf -X POST localhost:8000/accounts/ \
            -H "Content-Type: application/json" -d '{"name": "ci"}'
          docker logs ledger
