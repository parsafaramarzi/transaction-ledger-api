<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Transaction Ledger</title>
  <desc id="d">A ledger page: a transfer of 250.00 debits one account and credits another, and the net is 0.00.</desc>

  <!-- ledger paper: dark green ground, ruled lines -->
  <rect width="1280" height="640" fill="#0F241E"/>
  <g stroke="#1B3A30" stroke-width="2">
    <line x1="0" y1="40"  x2="1280" y2="40"/>
    <line x1="0" y1="80"  x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="440" x2="1280" y2="440"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="520" x2="1280" y2="520"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- red double margin rule -->
  <g stroke="#C8463B" stroke-width="2">
    <line x1="76" y1="0" x2="76" y2="640"/>
    <line x1="84" y1="0" x2="84" y2="640"/>
  </g>

  <!-- title block, top-left, set on the rules -->
  <text x="132" y="156" fill="#6F8F80" font-family="Consolas, 'Cascadia Mono', monospace"
        font-size="19" letter-spacing="5">FASTAPI  ·  SQLITE  ·  IDEMPOTENT</text>
  <text x="128" y="236" fill="#EDEFE6" font-family="Georgia, 'Times New Roman', serif"
        font-size="88" font-weight="700" letter-spacing="-1">Transaction Ledger</text>
  <text x="132" y="316" fill="#9FB8AB" font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-style="italic">Money is never created, lost, or applied twice.</text>

  <!-- the ledger entry, bottom-right: one transfer, balanced -->
  <g font-family="Consolas, 'Cascadia Mono', monospace">
    <text x="640" y="396" fill="#6F8F80" font-size="16" letter-spacing="3">ACCOUNT</text>
    <text x="960" y="396" fill="#6F8F80" font-size="16" letter-spacing="3" text-anchor="end">DEBIT</text>
    <text x="1130" y="396" fill="#6F8F80" font-size="16" letter-spacing="3" text-anchor="end">CREDIT</text>

    <text x="640" y="436" fill="#EDEFE6" font-size="30">alice</text>
    <text x="960" y="436" fill="#E4685B" font-size="30" text-anchor="end">250.00</text>
    <text x="1130" y="436" fill="#3F5E50" font-size="30" text-anchor="end">–</text>

    <text x="640" y="476" fill="#EDEFE6" font-size="30">bob</text>
    <text x="960" y="476" fill="#3F5E50" font-size="30" text-anchor="end">–</text>
    <text x="1130" y="476" fill="#CFE3D6" font-size="30" text-anchor="end">250.00</text>

    <text x="640" y="556" fill="#9FB8AB" font-size="30">net</text>
    <text x="1130" y="556" fill="#EDEFE6" font-size="34" font-weight="700" text-anchor="end">0.00</text>

    <text x="640" y="596" fill="#6F8F80" font-size="16">Idempotency-Key: transfer-001  →  applied once</text>
  </g>
  <!-- double underline = the books balance -->
  <g stroke="#EDEFE6" stroke-width="2">
    <line x1="1020" y1="568" x2="1130" y2="568"/>
    <line x1="1020" y1="574" x2="1130" y2="574"/>
  </g>
</svg>
