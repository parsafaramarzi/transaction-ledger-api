<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="t d">
  <title id="t">Transaction Ledger</title>
  <desc id="d">A ledger page: a transfer of 250.00 debits one account and credits another, and the net is 0.00.</desc>

  <!-- ledger paper: dark green ground, ruled lines -->
  <rect width="1600" height="400" fill="#0F241E"/>
  <g stroke="#1B3A30" stroke-width="2">
    <line x1="0" y1="40"  x2="1600" y2="40"/>
    <line x1="0" y1="80"  x2="1600" y2="80"/>
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="280" x2="1600" y2="280"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
  </g>

  <!-- red double margin rule -->
  <g stroke="#C8463B" stroke-width="2">
    <line x1="116" y1="0" x2="116" y2="400"/>
    <line x1="124" y1="0" x2="124" y2="400"/>
  </g>

  <!-- title block, set on the rules -->
  <text x="172" y="116" fill="#6F8F80" font-family="Consolas, 'Cascadia Mono', monospace"
        font-size="17" letter-spacing="4">FASTAPI  ·  SQLITE  ·  IDEMPOTENT</text>
  <text x="168" y="196" fill="#EDEFE6" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="700" letter-spacing="-1">Transaction Ledger</text>
  <text x="172" y="276" fill="#9FB8AB" font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-style="italic">Money is never created, lost, or applied twice.</text>

  <!-- the ledger entry: one transfer, balanced -->
  <g font-family="Consolas, 'Cascadia Mono', monospace">
    <text x="1070" y="116" fill="#6F8F80" font-size="15" letter-spacing="3">ACCOUNT</text>
    <text x="1380" y="116" fill="#6F8F80" font-size="15" letter-spacing="3" text-anchor="end">DEBIT</text>
    <text x="1520" y="116" fill="#6F8F80" font-size="15" letter-spacing="3" text-anchor="end">CREDIT</text>

    <text x="1070" y="156" fill="#EDEFE6" font-size="26">alice</text>
    <text x="1380" y="156" fill="#E4685B" font-size="26" text-anchor="end">250.00</text>
    <text x="1520" y="156" fill="#3F5E50" font-size="26" text-anchor="end">–</text>

    <text x="1070" y="196" fill="#EDEFE6" font-size="26">bob</text>
    <text x="1380" y="196" fill="#3F5E50" font-size="26" text-anchor="end">–</text>
    <text x="1520" y="196" fill="#CFE3D6" font-size="26" text-anchor="end">250.00</text>

    <text x="1070" y="276" fill="#9FB8AB" font-size="26">net</text>
    <text x="1520" y="276" fill="#EDEFE6" font-size="30" font-weight="700" text-anchor="end">0.00</text>

    <text x="1070" y="350" fill="#6F8F80" font-size="15">Idempotency-Key: transfer-001  →  applied once</text>
  </g>
  <!-- double underline = the books balance -->
  <g stroke="#EDEFE6" stroke-width="2">
    <line x1="1420" y1="288" x2="1520" y2="288"/>
    <line x1="1420" y1="294" x2="1520" y2="294"/>
  </g>
</svg>
